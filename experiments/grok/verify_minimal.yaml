# Minimal config for step-by-step TTNN vs PyTorch comparison
p: 97
train_frac: 0.5
pad_to: 32
batch_size: 32
steps: 200
log_every: 20
eval_every: 20
seed: 42

optimizer: adam
lr: 0.001
beta1: 0.9
beta2: 0.999
eps: 1e-6
weight_decay: 0.01

# Small model for debugging (must be multiples of 32)
dim: 64
heads: 2
ffn_mult: 2
layers: 1
use_layer_norm: 1
ln_eps: 1e-5
loss_scale: 1.0

# Dump all intermediate tensors
dump_outputs: 1
dump_steps: 5
dump_dir: /home/howard/ttnn-perf/experiments/grok/outputs/verify_minimal
dump_steps_dir: /home/howard/ttnn-perf/experiments/grok/outputs/verify_minimal_steps

csv: /home/howard/ttnn-perf/experiments/grok/verify_minimal.csv
