# GPT2 rebuild profiling config (same params, fewer steps)

data_dir: /home/howard/ttnn-perf/train/gpt2/data
outputs_dir: /home/howard/ttnn-perf/train/gpt2/outputs_profile

batch_size: 32
seq: 32
dim: 128
heads: 4
ffn_mult: 4
vocab: 160

# Stage control:
# 0 = tok+pos only
# 1 = +ln1
# 2 = +attention (residual1)
# 3 = +ffn (output)
# 4 = +lm_head (logits)
stage: 4

steps: 50
lr: 1e-3
beta1: 0.9
beta2: 0.999
eps: 1e-8
weight_decay: 0.01
log_every: 10

seed: 1
init_std: 0.02
ln_eps: 1e-5

# Dump controls
dump_outputs: 0
