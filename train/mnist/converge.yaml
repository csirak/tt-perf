# MNIST MLP train convergence config

data_dir: /home/howard/ttnn-perf/train/mnist/data
outputs_dir: /home/howard/ttnn-perf/train/mnist/outputs_converge

# Dataset
train_samples: 256
seed: 1
pad_to: 1024
num_classes: 32

# Model
hidden_dim: 256
init_std: 0.02

# Training
batch_size: 32
steps: 100
lr: 1e-3
beta1: 0.9
beta2: 0.999
eps: 1e-8
weight_decay: 1e-2

# Dumps
# Only dump step 0 for sanity
# (keep small to avoid large outputs)
dump_steps: 1
